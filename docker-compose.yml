services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      GUJRERA_BASE_URL: https://gujrera.gujarat.gov.in
      CORS_ALLOW_ORIGINS: '["*"]'
      OPENSSL_CONF: /app/openssl_legacy.cnf
    volumes:
      - ./data:/app/data
